apiVersion: v1
kind: PersistentVolume
metadata:
  name: task-pv-volume
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 10Gi # armazenamento do PV
  accessModes:
    - ReadWriteOnce # forma de acesso ao PV
  hostPath:
    path: "/mnt/data" # caminho em que esse PV será utilizado