<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="center-align">Product Management</h1>
        <div class="section">
            <h2>Products</h2>
            <table class="striped" id="productsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Products will be dynamically added here -->
                </tbody>
            </table>
        </div>
        <div class="section">
            <h2>Add Product</h2>
            <form id="addProductForm">
                <div class="input-field">
                    <input type="text" id="productName" required>
                    <label for="productName">Name</label>
                </div>
                <div class="input-field">
                    <input type="number" id="productPrice" required>
                    <label for="productPrice">Price</label>
                </div>
                <button type="submit" class="btn waves-effect waves-light">Add Product</button>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        const apiUrl = 'https://meuservico.azure.com';

        $(document).ready(function() {
            loadProducts();

            $('#addProductForm').on('submit', function(e) {
                e.preventDefault();
                const name = $('#productName').val();
                const price = $('#productPrice').val();
                addProduct(name, price);
            });
        });

        function loadProducts() {
            $.get(`${apiUrl}/products`, function(data) {
                const productsTable = $('#productsTable tbody');
                productsTable.empty();
                data.forEach(product => {
                    productsTable.append(`
                        <tr>
                            <td>${product.id}</td>
                            <td>${product.name}</td>
                            <td>${product.price}</td>
                            <td>
                                <button class="btn yellow darken-2 btn-small" onclick="editProduct(${product.id})">Edit</button>
                                <button class="btn red btn-small" onclick="deleteProduct(${product.id})">Delete</button>
                            </td>
                        </tr>
                    `);
                });
            });
        }

        function addProduct(name, price) {
            $.post(`${apiUrl}/products`, { name, price }, function() {
                loadProducts();
                $('#addProductForm')[0].reset();
            });
        }

        function editProduct(id) {
            const name = prompt('Enter new name:');
            const price = prompt('Enter new price:');
            if (name && price) {
                $.ajax({
                    url: `${apiUrl}/products/${id}`,
                    type: 'PUT',
                    data: { name, price },
                    success: function() {
                        loadProducts();
                    }
                });
            }
        }

        function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                $.ajax({
                    url: `${apiUrl}/products/${id}`,
                    type: 'DELETE',
                    success: function() {
                        loadProducts();
                    }
                });
            }
        }
    </script>
</body>
</html>
