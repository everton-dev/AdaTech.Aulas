trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  azureSubscription: '<Your Azure Subscription>'
  functionAppName: '<Your Function App Name>'
  resourceGroupName: '<Your Resource Group Name>'
  teamsWebhookUrl: '<Your Teams Webhook URL>'
  
  stages:
  - stage: Dev
    jobs:
    - job: Dev
      steps:
      - task: UseDotNet@2
        inputs:
          packageType: 'sdk'
          version: '8.x'

      - script: |
          dotnet restore
        displayName: 'Restore dependencies'

      - script: |
          dotnet build --configuration $(buildConfiguration)
        displayName: 'Build project'

      - script: |
          dotnet publish --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)
        displayName: 'Publish project'

      - task: AzureFunctionApp@1
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'functionApp'
          appName: $(functionAppName)
          package: '$(Build.ArtifactStagingDirectory)'

      - script: |
          curl -H 'Content-Type: application/json' -d '{"text": "Dev deployment completed successfully."}' $(teamsWebhookUrl)
        displayName: 'Send message to Teams'

  - stage: QA
    jobs:
    - job: QA
      steps:
      - task: UseDotNet@2
        inputs:
          packageType: 'sdk'
          version: '8.x'

      - script: |
          dotnet restore
        displayName: 'Restore dependencies'

      - script: |
          dotnet build --configuration $(buildConfiguration)
        displayName: 'Build project'

      - script: |
          dotnet publish --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)
        displayName: 'Publish project'

      - task: AzureFunctionApp@1
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'functionApp'
          appName: $(functionAppName)
          package: '$(Build.ArtifactStagingDirectory)'

      - script: |
          curl -H 'Content-Type: application/json' -d '{"text": "QA deployment completed successfully."}' $(teamsWebhookUrl)
        displayName: 'Send message to Teams'

  - stage: Prod
    jobs:
    - job: Prod
      steps:
      - task: UseDotNet@2
        inputs:
          packageType: 'sdk'
          version: '8.x'

      - script: |
          dotnet restore
        displayName: 'Restore dependencies'

      - script: |
          dotnet build --configuration $(buildConfiguration)
        displayName: 'Build project'

      - script: |
          dotnet publish --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)
        displayName: 'Publish project'

      - task: AzureFunctionApp@1
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'functionApp'
          appName: $(functionAppName)
          package: '$(Build.ArtifactStagingDirectory)'

      - script: |
          curl -H 'Content-Type: application/json' -d '{"text": "Prod deployment completed successfully."}' $(teamsWebhookUrl)
        displayName: 'Send message to Teams'