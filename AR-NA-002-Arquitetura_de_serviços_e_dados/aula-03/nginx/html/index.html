<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página de teste personalizada servida pelo Nginx em Docker Compose.">
  <title>Nginx | HTML atualizado</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(260px, 0.85fr);
      width: min(980px, 100%);
      overflow: hidden;
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      background: var(--cp-surface);
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    .content { padding: clamp(32px, 6vw, 72px); }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      color: var(--cp-success);
      font-weight: 700;
    }
    .status::before {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cp-success);
      content: "";
    }
    h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 5rem); line-height: 1; letter-spacing: 0; }
    h1 span { color: var(--cp-accent); }
    p { margin: 24px 0 0; color: var(--cp-text-muted); font-size: 1.1rem; line-height: 1.7; }
    code {
      padding: 3px 7px;
      border-radius: 0.625rem;
      background: var(--cp-surface-soft);
      color: var(--cp-accent);
      font-family: Consolas, "Courier New", Courier, monospace;
    }
    .visual {
      display: grid;
      place-items: center;
      min-height: 420px;
      padding: 32px;
      border-left: 1px solid var(--cp-border);
      background: var(--cp-accent-soft);
    }
    .visual img { display: block; width: min(100%, 330px); height: auto; }
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; }
      .visual { min-height: 240px; border-top: 1px solid var(--cp-border); border-left: 0; }
      .visual img { width: min(72%, 260px); }
    }
  </style>
</head>
<body>
  <main>
    <section class="content">
      <div class="status">Nginx respondendo</div>
      <h1>HTML <span>trocado via docker cp</span> com sucesso.</h1>
      <p>Esta não é a página padrão do Nginx. O arquivo montado em <code>/usr/share/nginx/html</code> está sendo servido pelo container.</p>
      <p>Agora altere <code>html/index.html</code>, atualize o navegador e veja a mudança imediatamente.</p>
    </section>
    <figure class="visual">
      <img src="nginx-success.svg" alt="Ilustração de um navegador conectado a um servidor Nginx">
    </figure>
  </main>
</body>
</html>
