<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Primeiro desafio da Aula 03: página personalizada servida pelo Apache HTTP Server em Docker.">
  <title>Aula 03 | Apache com Docker</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main {
      width: min(760px, 100%);
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid var(--cp-border);
      border-top: 6px solid var(--cp-accent);
      border-radius: 16px;
      background: var(--cp-surface);
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      color: var(--cp-success);
      font-weight: 700;
    }
    .status::before {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cp-success);
      content: "";
    }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 4.5rem); line-height: 1.05; letter-spacing: 0; }
    p { margin: 20px 0 0; color: var(--cp-text-muted); font-size: 1.1rem; line-height: 1.7; }
    code {
      padding: 3px 7px;
      border-radius: 0.625rem;
      background: var(--cp-surface-soft);
      color: var(--cp-accent);
      font-family: Consolas, "Courier New", Courier, monospace;
    }
  </style>
</head>
<body>
  <main>
    <div class="status">Apache em execução</div>
    <h1>It works, do nosso jeito.</h1>
    <p>A página padrão do Apache foi substituída com sucesso por este conteúdo da <strong>Aula 03</strong>.</p>
    <p>Edite <code>site/index.html</code> e atualize o navegador para continuar o desafio.</p>
  </main>
</body>
</html>
