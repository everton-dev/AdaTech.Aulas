name: movieflix-platform

services:
  proxy:
    build: ./nginx
    image: ${DOCKERHUB_USERNAME:-local}/movieflix-proxy:latest
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USERNAME:-local}/movieflix-frontend:latest
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    image: ${DOCKERHUB_USERNAME:-local}/movieflix-backend:latest
    environment:
      PORT: 3000
      DB_HOST: db-oltp
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-app_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app_pass}
      DB_NAME: ${POSTGRES_DB:-products_db}
    depends_on:
      db-oltp:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  db-oltp:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pass}
      POSTGRES_DB: ${POSTGRES_DB:-products_db}
    volumes:
      - oltp-data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-dw:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DW_POSTGRES_USER:-dw_user}
      POSTGRES_PASSWORD: ${DW_POSTGRES_PASSWORD:-dw_pass}
      POSTGRES_DB: ${DW_POSTGRES_DB:-movieflix_dw}
    ports:
      - "5433:5432"
    volumes:
      - dw-data:/var/lib/postgresql/data
      - ./data-ecosystem/sql/01_dw_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data-ecosystem/sql/02_datamarts.sql:/docker-entrypoint-initdb.d/02-datamarts.sql:ro
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  etl:
    build: ./data-ecosystem/etl
    image: ${DOCKERHUB_USERNAME:-local}/movieflix-etl:latest
    environment:
      DW_HOST: db-dw
      DW_PORT: 5432
      DW_USER: ${DW_POSTGRES_USER:-dw_user}
      DW_PASSWORD: ${DW_POSTGRES_PASSWORD:-dw_pass}
      DW_NAME: ${DW_POSTGRES_DB:-movieflix_dw}
      DATALAKE_PATH: /datalake
    volumes:
      - ./data-ecosystem/datalake:/datalake:ro
    depends_on:
      db-dw:
        condition: service_healthy
    networks:
      - app-network
    profiles: ["etl"]

networks:
  app-network:
    driver: bridge

volumes:
  oltp-data:
  dw-data: