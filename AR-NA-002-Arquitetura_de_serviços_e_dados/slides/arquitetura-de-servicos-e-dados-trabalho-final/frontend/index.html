<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo operacional para gerenciamento de produtos.">
  <title>Stockroom | Produtos</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cp-bg); color: var(--cp-text); font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1160px, calc(100% - 32px)); margin: 0 auto; }
    header { border-bottom: 1px solid var(--cp-border); background: var(--cp-surface); }
    .nav { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font-size: 1.2rem; font-weight: 800; }
    .brand span { color: var(--cp-accent); }
    .system-state { display: flex; align-items: center; gap: 8px; color: var(--cp-text-muted); font-size: .9rem; }
    .system-state::before { width: 9px; height: 9px; border-radius: 50%; background: var(--cp-success); content: ""; }
    main { padding: 40px 0 64px; }
    .intro { display: grid; grid-template-columns: minmax(0, 1fr) 300px; align-items: center; gap: 40px; padding-bottom: 36px; }
    .eyebrow { margin: 0 0 8px; color: var(--cp-accent); font-size: .78rem; font-weight: 800; text-transform: uppercase; }
    h1 { max-width: 700px; margin: 0; font-size: clamp(2.2rem, 6vw, 4.8rem); line-height: 1; letter-spacing: 0; }
    .intro-copy { max-width: 650px; margin: 20px 0 0; color: var(--cp-text-muted); font-size: 1.05rem; line-height: 1.7; }
    .intro img { width: 100%; max-height: 220px; object-fit: contain; }
    .workspace { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 24px; align-items: start; }
    .panel { border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-surface); box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border); }
    .form-panel { position: sticky; top: 20px; padding: 24px; }
    h2 { margin: 0; font-size: 1.25rem; }
    .form-hint { margin: 6px 0 20px; color: var(--cp-text-muted); font-size: .9rem; }
    label { display: block; margin-bottom: 8px; font-size: .9rem; font-weight: 700; }
    input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--cp-border-strong); border-radius: .625rem; background: var(--cp-bg-elevated); color: var(--cp-text); outline: 0; }
    input:focus { border-color: var(--cp-accent); box-shadow: 0 0 0 3px var(--cp-accent-soft); }
    .counter { display: block; margin-top: 6px; color: var(--cp-text-muted); font-size: .78rem; text-align: right; }
    .form-actions { display: flex; gap: 8px; margin-top: 20px; }
    .button { min-height: 42px; padding: 9px 14px; border: 1px solid transparent; border-radius: .625rem; font-weight: 700; }
    .button-primary { flex: 1; background: var(--cp-accent); color: var(--cp-accent-fg); }
    .button-primary:hover { background: var(--cp-accent-hover); }
    .button-secondary { border-color: var(--cp-border); background: var(--cp-surface-soft); color: var(--cp-text); }
    .button-danger { border-color: var(--cp-danger); background: var(--cp-surface); color: var(--cp-danger); }
    .list-panel { overflow: hidden; }
    .list-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border-bottom: 1px solid var(--cp-border); }
    .count { color: var(--cp-text-muted); font-size: .9rem; }
    .product-list { margin: 0; padding: 0; list-style: none; }
    .product { min-height: 76px; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--cp-border); }
    .product:last-child { border-bottom: 0; }
    .product-id { width: 44px; height: 44px; display: grid; place-items: center; border-radius: .625rem; background: var(--cp-accent-soft); color: var(--cp-accent); font-weight: 800; }
    .product-name { overflow-wrap: anywhere; font-weight: 700; }
    .row-actions { display: flex; gap: 8px; }
    .icon-button { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--cp-border); border-radius: .625rem; background: var(--cp-surface); color: var(--cp-text); }
    .icon-button:hover { border-color: var(--cp-accent); color: var(--cp-accent); }
    .icon-button svg { width: 18px; height: 18px; }
    .message { margin: 0; padding: 28px; color: var(--cp-text-muted); text-align: center; }
    .toast { position: fixed; right: 24px; bottom: 24px; max-width: min(360px, calc(100% - 48px)); padding: 12px 16px; border-radius: .625rem; background: var(--cp-text); color: var(--cp-bg); box-shadow: var(--cp-shadow); }
    .toast[hidden] { display: none; }
    @media (max-width: 780px) {
      .intro { grid-template-columns: 1fr; }
      .intro img { display: none; }
      .workspace { grid-template-columns: 1fr; }
      .form-panel { position: static; }
    }
    @media (max-width: 480px) {
      .product { grid-template-columns: 44px minmax(0, 1fr); }
      .row-actions { grid-column: 2; }
      .system-state { display: none; }
    }
  </style>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="shell nav">
      <div class="brand">Stock<span>room</span></div>
      <div class="system-state">Serviços operacionais</div>
    </div>
  </header>
  <main class="shell">
    <section class="intro">
      <div>
        <p class="eyebrow">Catálogo operacional</p>
        <h1>Produtos, sem atrito.</h1>
        <p class="intro-copy">Cadastre, revise e mantenha o catálogo conectado à API e ao banco transacional PostgreSQL.</p>
      </div>
      <img src="product-shelf.svg" alt="Ilustração de caixas de produtos organizadas em uma prateleira">
    </section>

    <div class="workspace">
      <section class="panel form-panel" aria-labelledby="form-title">
        <h2 id="form-title">Novo produto</h2>
        <p class="form-hint" id="form-hint">Adicione um item ao catálogo.</p>
        <form id="product-form">
          <label for="product-name">Nome do produto</label>
          <input id="product-name" name="name" maxlength="50" required autocomplete="off" placeholder="Ex.: Webcam" aria-describedby="name-counter">
          <span class="counter" id="name-counter">0/50</span>
          <div class="form-actions">
            <button class="button button-primary" id="submit-button" type="submit">Adicionar</button>
            <button class="button button-secondary" id="cancel-button" type="button" hidden>Cancelar</button>
          </div>
        </form>
      </section>

      <section class="panel list-panel" aria-labelledby="list-title">
        <div class="list-header">
          <h2 id="list-title">Inventário</h2>
          <span class="count" id="product-count">Carregando...</span>
        </div>
        <p class="message" id="list-message">Buscando produtos...</p>
        <ul class="product-list" id="product-list" aria-live="polite"></ul>
      </section>
    </div>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
