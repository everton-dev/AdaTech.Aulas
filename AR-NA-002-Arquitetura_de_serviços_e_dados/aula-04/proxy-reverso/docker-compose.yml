name: aula-04-proxy-reverso

services:
  meu-gateway:
    image: nginx:1.28-alpine
    container_name: meu-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      messages:
        condition: service_healthy
      payments:
        condition: service_healthy
    networks:
      - rede-publica
      - rede-interna
    restart: unless-stopped

  messages:
    build:
      context: ../api-messages
    container_name: messages
    expose:
      - "3000"
    networks:
      - rede-interna
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/day', { headers: { 'X-Health-Check': 'true' } }).then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  payments:
    build:
      context: ../api-payments
    container_name: payments
    expose:
      - "4000"
    networks:
      - rede-interna
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/pix/0', { method: 'POST', headers: { 'X-Health-Check': 'true' } }).then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  rede-publica:
  rede-interna:
    internal: true