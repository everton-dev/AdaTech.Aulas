upstream messages_api { server messages:3000; }
upstream payments_api { server payments:4000; }

log_format gateway 'GATEWAY [$time_iso8601] id=$request_id | $request_method $request_uri | -> $upstream_addr | upstream=$upstream_status | response=$status | time=${request_time}s';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout gateway;
    error_log /dev/stderr warn;

    location /api/messages/ {
        proxy_pass http://messages_api/;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/payments/ {
        proxy_pass http://payments_api/;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        access_log off;
        return 404;
    }
}