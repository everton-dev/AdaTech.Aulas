[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-integration-course"
version = "0.1.0"
description = "Data Integration Course with Apache Airflow"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Everton José Benedicto", email = "everton.devbr@gmail.com"}
]
maintainers = [
    {name = "Everton José Benedicto", email = "everton.devbr@gmail.com"}
]
keywords = ["airflow", "data-integration", "etl", "data-pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "apache-airflow==2.11.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "sqlalchemy>=1.4.0,<2.0",
    "python-dateutil>=2.8.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
airflow-providers = [
    "apache-airflow-providers-postgres>=5.0.0",
    "apache-airflow-providers-mysql>=5.0.0",
    "apache-airflow-providers-amazon>=8.0.0",
    "apache-airflow-providers-google>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/data-integration-course"
Documentation = "https://github.com/yourusername/data-integration-course#readme"
Repository = "https://github.com/yourusername/data-integration-course.git"
Issues = "https://github.com/yourusername/data-integration-course/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["aula-*", "*.py"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.sql", "*.csv", "*.json", "*.yaml", "*.yml"]

# Black formatter configuration
[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["aula01", "aula02", "aula03"]

# MyPy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["aula-01", "aula-02", "aula-03"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# Flake8 configuration (in setup.cfg format, but documented here)
# Create a .flake8 or setup.cfg file with:
# [flake8]
# max-line-length = 88
# extend-ignore = E203, W503
# exclude = .git,__pycache__,build,dist,.venv

# Airflow specific configuration
[tool.airflow]
dags_folder = "dags"
logs_folder = "logs"
plugins_folder = "plugins"
